<!DOCTYPE html>
<html lang="en" data-theme="dark" class="sk-loading">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Order Placed</title>
  <link id="gfonts" rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500;600&display=swap" />
  <style>html.sk-loading body{opacity:0}body{opacity:1;transition:opacity .25s ease}</style>
  <script>setTimeout(function(){document.documentElement.classList.remove("sk-loading");},1800);</script>
  <style>
    .cg-wrap { max-width:560px; margin:0 auto; padding:64px 24px 90px; text-align:center; }
    .cg-check { width:72px; height:72px; margin:0 auto 22px; border-radius:50%; background:color-mix(in srgb,var(--success) 15%,transparent); display:flex; align-items:center; justify-content:center; color:var(--success); animation:cgPop .5s cubic-bezier(.34,1.56,.64,1); }
    .cg-check svg { width:34px; height:34px; }
    @keyframes cgPop { from{transform:scale(0);opacity:0} to{transform:scale(1);opacity:1} }
    .cg-heading { font-family:var(--font-head); font-size:clamp(1.6rem,4.5vw,2.2rem); font-weight:800; letter-spacing:-.5px; margin-bottom:10px; }
    .cg-message { color:var(--text2); font-size:14.5px; line-height:1.7; margin-bottom:22px; }
    .cg-order-id { display:inline-flex; align-items:center; gap:8px; background:var(--bg2); border:1px solid var(--border); border-radius:var(--radius-sm); padding:8px 16px; font-size:13px; font-weight:600; font-family:monospace; letter-spacing:1px; margin-bottom:26px; }
    .cg-note { background:var(--bg2); border:1px solid var(--border); border-radius:var(--radius-md); padding:14px 18px; font-size:13.5px; color:var(--text2); line-height:1.6; margin-bottom:26px; }
    .cg-media { margin-bottom:26px; position:relative; border-radius:var(--radius-md); overflow:hidden; background:var(--bg2); }
    .cg-media img, .cg-media video { width:100%; display:block; max-height:420px; object-fit:cover; }
    .cg-media video { position:absolute; inset:0; height:100%; }
    .cg-media audio { width:100%; margin-top:10px; display:block; }
    .cg-home-btn { display:inline-flex; align-items:center; gap:8px; }
  </style>
</head>
<body class="sk-default">
  <div id="announcementBar"></div>
  <nav id="mainNav"></nav>

  <div class="cg-wrap">
    <div class="cg-check"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="m5 12 5 5 9-10"/></svg></div>
    <h1 class="cg-heading" id="cgHeading">Order Placed Successfully!</h1>
    <p class="cg-message" id="cgMessage">Thank you for shopping with us. We'll get your order ready right away.</p>

    <div class="cg-order-id" id="cgOrderId" style="display:none">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:14px;height:14px;display:inline-block;vertical-align:-2px"><path d="M20.6 12.6 12 21.2 2.8 12 11.4 3.4H18a2 2 0 0 1 2 2v7.2z"/><circle cx="14.5" cy="9.5" r="1.3"/></svg>
      Order ID: <strong id="cgOrderIdVal"></strong>
    </div>

    <div class="cg-note" id="cgNote" style="display:none"></div>

    <div class="cg-media" id="cgMedia" style="display:none">
      <img id="cgImageEl" alt="" />
      <video id="cgVideoEl" autoplay muted loop playsinline></video>
      <audio id="cgAudioEl" controls autoplay></audio>
    </div>

    <a href="./index.html" class="btn btn-primary cg-home-btn" id="cgHomeBtn">
      <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="m3 10 9-7 9 7"/><path d="M5 9v11a1 1 0 0 0 1 1h4v-6h4v6h4a1 1 0 0 0 1-1V9"/></svg>
      Continue Shopping
    </a>
  </div>

  <footer style="border-top:1px solid var(--border);padding:28px 24px;text-align:center;color:var(--text3);font-size:13px">
    &copy; <span id="yr"></span> <span data-store-name>My Store</span>
  </footer>

  <script src="./js/app.js"></script>
  <script>
    function qs(name) { return new URLSearchParams(window.location.search).get(name); }

    async function main(){
      await SK.init();
      SK.renderNav();
      document.getElementById('yr').textContent = new Date().getFullYear();
      document.title = `Order Placed — ${SK.config.store?.name || 'My Store'}`;

      const cg = SK.config.congrats || {};
      const chk = SK.config.checkout || {};
      document.getElementById('cgHeading').textContent = cg.heading || 'Order Placed Successfully!';
      document.getElementById('cgMessage').textContent = cg.message || chk.thankYouMessage || "Thank you for shopping with us. We'll get your order ready right away.";

      const orderId = qs('order');
      if (orderId) {
        document.getElementById('cgOrderId').style.display = '';
        document.getElementById('cgOrderIdVal').textContent = orderId;
      }

      // Home / continue-shopping link — points back to whichever template's
      // index page the customer actually checked out from.
      const home = qs('home');
      if (home) document.getElementById('cgHomeBtn').href = home;

      // Method-specific note
      const method = qs('method');
      const paid = qs('paid') === '1';
      const notes = {
        cod: 'Pay with cash when your order arrives at your door.',
        social: "We'll confirm your order details over chat shortly.",
        stripe: paid ? 'Payment received — thank you!' : 'Your card payment is being confirmed.',
        paypal: paid ? 'Payment received via PayPal — thank you!' : 'Your PayPal payment is being confirmed.',
        razorpay: paid ? 'Payment received — thank you!' : 'Your payment is being confirmed.',
      };
      if (method && notes[method]) {
        document.getElementById('cgNote').style.display = '';
        document.getElementById('cgNote').textContent = notes[method];
      }

      // Media — checks config.json for an explicit URL first (e.g. a CDN
      // link); if that's blank, it falls back to the assets/congrats/
      // folder using fixed filenames — same drop-in convention as the
      // hero image/video on your homepage. Missing files just fail
      // silently, same as hero media does.
      const videoSrc = cg.videoUrl || './assets/congrats/congrats.mp4';
      const imageSrc = cg.imageUrl || './assets/congrats/congrats.jpg';
      const audioSrc = cg.audioUrl || './assets/congrats/congrats.mp3';

      const mediaEl = document.getElementById('cgMedia');
      const videoEl = document.getElementById('cgVideoEl');
      const imgEl = document.getElementById('cgImageEl');
      const audioEl = document.getElementById('cgAudioEl');
      let anyLoaded = false;
      const reveal = () => { if (!anyLoaded) { anyLoaded = true; mediaEl.style.display = ''; } };

      imgEl.addEventListener('load', reveal);
      imgEl.addEventListener('error', () => { imgEl.style.display = 'none'; });
      imgEl.src = imageSrc;

      const source = document.createElement('source');
      source.src = videoSrc; source.type = 'video/mp4';
      videoEl.appendChild(source);
      videoEl.addEventListener('loadeddata', reveal);
      SK.bindHeroVideo(videoEl); // same helper the homepage hero uses — hides video on failure, revealing the image beneath

      audioEl.addEventListener('loadeddata', reveal);
      audioEl.addEventListener('error', () => { audioEl.remove(); });
      audioEl.src = audioSrc;

      SK.reveal();
    }
    main();
  </script>
</body>
</html>
