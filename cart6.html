<!DOCTYPE html>
<html lang="en" class="sk-loading">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Cart — Spotlight</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" />
<style id="sk-anti-fouc">html.sk-loading body{opacity:0}body{transition:opacity .25s ease}</style>
<script>setTimeout(function(){document.documentElement.classList.remove("sk-loading");},1800);</script>
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  :root{--sp-ink:#1c1714;--sp-mute:#7a716a;--sp-line:#e7e1d8;--sp-card:#f4efe6;--sp-paper:#fffdf9;--sp-accent:#b8763a}
  body{font-family:'Inter',sans-serif;color:var(--sp-ink);background:var(--sp-paper)}
  h1{font-family:'Fraunces',serif;font-weight:700}
  a{color:inherit;text-decoration:none} img{display:block;max-width:100%}
  .sp-nav{position:sticky;top:0;z-index:300;background:var(--sp-paper);border-bottom:1px solid var(--sp-line);height:70px;display:flex;align-items:center;justify-content:space-between;padding:0 32px}
  .sp-logo{font-family:'Fraunces',serif;font-size:1.4rem;font-weight:700}
  .sp-backlink{font-size:13px;font-weight:600;display:flex;align-items:center;gap:6px;color:#444}
  .sp-backlink svg{width:14px;height:14px}

  .sp-wrap{max-width:760px;margin:0 auto;padding:46px 24px 90px}
  .sp-wrap h1{font-size:clamp(1.8rem,4vw,2.4rem);margin-bottom:28px}
  .sp-line{display:grid;grid-template-columns:80px 1fr auto auto;gap:16px;align-items:center;padding:18px 0;border-bottom:1px solid var(--sp-line)}
  .sp-line img{width:80px;height:80px;object-fit:cover;background:var(--sp-card);border-radius:10px}
  .sp-lname{font-weight:700;font-size:14px;margin-bottom:6px}
  .sp-lprice{font-size:13px;color:var(--sp-mute)}
  .sp-lqty{display:flex;align-items:center;border:1px solid var(--sp-line);border-radius:30px;background:#fff}
  .sp-lqty button{width:28px;height:28px;background:none;border:none;font-size:14px;cursor:pointer;font-weight:700}
  .sp-lqty span{width:26px;text-align:center;font-weight:600;font-size:13px}
  .sp-ltotal{font-weight:700;font-size:14px;text-align:right;min-width:64px}
  .sp-remove{background:none;border:none;cursor:pointer;color:var(--sp-mute);width:15px;height:15px;justify-self:end}

  .sp-empty{text-align:center;padding:80px 20px;color:var(--sp-mute)}
  .sp-empty svg{width:50px;height:50px;margin-bottom:18px;color:var(--sp-line)}
  .sp-empty a{display:inline-block;margin-top:18px;background:var(--sp-ink);color:#fff;padding:14px 28px;border-radius:30px;font-weight:700;font-size:13px}

  .sp-summary{border:1px solid var(--sp-line);border-radius:14px;padding:24px;margin-top:26px;background:var(--sp-card)}
  .sp-summary h2{font-family:'Fraunces',serif;font-size:1.1rem;margin-bottom:18px}
  .sp-srow{display:flex;justify-content:space-between;font-size:14px;margin-bottom:12px;color:var(--sp-mute)}
  .sp-srow.total{color:var(--sp-ink);font-size:1.15rem;font-weight:800;border-top:1px solid var(--sp-line);padding-top:14px;margin-top:8px}
  .sp-checkoutbtn{width:100%;background:var(--sp-ink);color:#fff;border:none;padding:16px;border-radius:30px;font-weight:700;font-size:14px;cursor:pointer;margin-top:16px}
  .sp-note{font-size:12px;color:var(--sp-mute);margin-top:14px;text-align:center}

  footer.sp-foot{background:var(--sp-ink);color:#cbc2b8;padding:26px 32px;text-align:center;font-size:12px}
</style>
</head>
<body>
<nav class="sp-nav">
  <a href="./index6.html" class="sp-logo" id="navLogoWrap" data-store-name>Spotlight</a>
  <a href="./index6.html" class="sp-backlink"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14"/><path d="m11 18-6-6 6-6"/></svg> Continue Shopping</a>
</nav>

<div class="sp-wrap"><h1>Your Cart</h1><div id="cartLayout"></div></div>

<footer class="sp-foot">&copy; <span id="yr"></span> <span data-store-name>Spotlight</span>. All rights reserved.</footer>

<script src="./js/app.js"></script>
<script>
  function lineHTML(item){
    return `<div class="sp-line">
      <img src="${item.image}" alt="${item.name}">
      <div><div class="sp-lname">${item.name}</div><div class="sp-lprice">${SK.price(item.price)} each</div></div>
      <div class="sp-lqty"><button onclick="SK.changeQty(${item.id},-1);render()">−</button><span>${item.qty}</span><button onclick="SK.changeQty(${item.id},1);render()">+</button></div>
      <div style="display:flex;flex-direction:column;align-items:flex-end;gap:8px">
        <div class="sp-ltotal">${SK.price(item.price*item.qty)}</div>
        <button class="sp-remove" onclick="SK.removeFromCart(${item.id});render()" title="Remove"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
      </div>
    </div>`;
  }
  function render(){
    const cart = SK.getCart();
    const wrap = document.getElementById('cartLayout');
    if (!cart.length){
      wrap.innerHTML = `<div class="sp-empty"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><path d="M16 10a4 4 0 0 1-8 0"/></svg><div>Your cart is empty.</div><a href="./index6.html">View Product</a></div>`;
      return;
    }
    const total = SK.cartTotal();
    wrap.innerHTML = `<div>${cart.map(lineHTML).join('')}</div>
      <div class="sp-summary">
        <h2>Order Summary</h2>
        <div class="sp-srow"><span>Subtotal</span><span>${SK.price(total)}</span></div>
        <div class="sp-srow total"><span>Total</span><span>${SK.price(total)}</span></div>
        <button class="sp-checkoutbtn" onclick="location.href='./checkout6.html'">Proceed to Checkout</button>
        <div class="sp-note">Taxes calculated at checkout. Cash on Delivery available.</div>
      </div>`;
  }
  async function main(){
    await SK.init();
    document.getElementById('yr').textContent = new Date().getFullYear();
    render();
    SK.reveal();
  }
  main();
</script>
</body>
</html>
