<!DOCTYPE html>
<html lang="en" class="sk-loading">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Product — Nova</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" />
<style id="sk-anti-fouc">html.sk-loading body{opacity:0}body{transition:opacity .25s ease}</style>
<script>setTimeout(function(){document.documentElement.classList.remove("sk-loading");},1800);</script>
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  :root{--nv-bg:#0a0e0c;--nv-bg2:#111613;--nv-card:#171c19;--nv-line:#252b27;--nv-mute:#8a958e;--nv-accent:#39ff8e;--nv-success:#39ff8e;--nv-danger:#ff5c5c}
  body{font-family:'Inter',sans-serif;color:#eef1ee;background:var(--nv-bg)}
  h1{font-family:'Space Grotesk',sans-serif}
  a{color:inherit;text-decoration:none} img{display:block;max-width:100%}
  .nv-nav{position:sticky;top:0;z-index:300;background:rgba(10,14,12,.9);backdrop-filter:blur(8px);border-bottom:1px solid var(--nv-line);height:74px;display:flex;align-items:center;justify-content:space-between;padding:0 32px}
  .nv-logo{font-family:'Space Grotesk',sans-serif;font-size:1.4rem;font-weight:700}
  .nv-logo span{color:var(--nv-accent)}
  .nv-ibtn{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--nv-card);border:1px solid var(--nv-line);cursor:pointer;position:relative;color:#eef1ee}
  .nv-ibtn svg{width:16px;height:16px}
  [data-cart-count]{position:absolute;top:-4px;right:-4px;background:var(--nv-accent);color:#0a0e0c;font-size:9px;font-weight:800;width:16px;height:16px;border-radius:50%;display:flex;align-items:center;justify-content:center}

  .nv-crumbs{max-width:1280px;margin:0 auto;padding:18px 32px 0;font-size:13px;color:var(--nv-mute)}
  .nv-crumbs a{color:var(--nv-accent)}
  .nv-pwrap{max-width:1280px;margin:0 auto;padding:24px 32px 70px;display:grid;grid-template-columns:1fr 1fr;gap:54px}
  @media(max-width:880px){.nv-pwrap{grid-template-columns:1fr;gap:24px}}

  .nv-mainimg{aspect-ratio:1;background:var(--nv-card);border:1px solid var(--nv-line);overflow:hidden;border-radius:14px;margin-bottom:10px}
  .nv-mainimg img{width:100%;height:100%;object-fit:cover}
  .nv-thumbs{display:flex;gap:8px}
  .nv-thumb{width:66px;height:66px;border-radius:10px;background:var(--nv-card);cursor:pointer;border:1px solid var(--nv-line);overflow:hidden}
  .nv-thumb.active{border-color:var(--nv-accent)}
  .nv-thumb img{width:100%;height:100%;object-fit:cover}

  .nv-info .nv-tag{font-size:11px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--nv-accent);margin-bottom:10px}
  .nv-info h1{font-size:clamp(1.7rem,3.5vw,2.3rem);margin-bottom:10px}
  .nv-stars{display:flex;align-items:center;gap:8px;margin-bottom:16px;font-size:13px;color:var(--nv-mute)}
  .nv-stars .row{display:flex;gap:1px}
  .nv-stars .row span{width:13px;height:13px;display:inline-flex}
  .nv-priceline{display:flex;align-items:center;gap:10px;margin-bottom:20px}
  .nv-price{font-size:1.6rem;font-weight:700;color:var(--nv-accent)}
  .nv-old{color:var(--nv-mute);text-decoration:line-through;font-size:1rem}
  .nv-pill{font-size:11px;font-weight:700;padding:4px 10px;border-radius:30px}
  .stock-in{background:rgba(57,255,142,.12);color:var(--nv-success)} .stock-limited{background:rgba(255,180,0,.12);color:#ffb400} .stock-out{background:rgba(255,92,92,.12);color:var(--nv-danger)}
  .nv-desc{font-size:14px;color:#c7cdc8;line-height:1.7;margin-bottom:24px}

  .nv-qty{display:flex;align-items:center;border:1px solid var(--nv-line);border-radius:8px;width:fit-content;margin-bottom:16px;background:var(--nv-card)}
  .nv-qty button{width:38px;height:38px;background:none;border:none;font-size:16px;cursor:pointer;color:#eef1ee;font-weight:700}
  .nv-qty span{width:34px;text-align:center;font-weight:700}
  .nv-actions{display:flex;gap:10px;margin-bottom:26px}
  .nv-addbig{flex:1;background:var(--nv-accent);color:#06150c;border:none;padding:16px;border-radius:8px;font-weight:700;font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px}
  .nv-addbig:disabled{opacity:.35;cursor:not-allowed}
  .nv-wish{width:52px;border:1px solid var(--nv-line);border-radius:8px;background:var(--nv-card);cursor:pointer;display:flex;align-items:center;justify-content:center;color:#eef1ee}
  .nv-wish svg{width:18px;height:18px}

  .nv-specs{display:grid;grid-template-columns:1fr 1fr;gap:10px;border-top:1px solid var(--nv-line);padding-top:18px;font-size:13px;color:var(--nv-mute)}
  .nv-specs span{display:flex;align-items:center;gap:7px}
  .nv-specs svg{width:15px;height:15px;color:var(--nv-accent)}

  .nv-related{max-width:1280px;margin:0 auto;padding:0 32px 80px}
  .nv-related h2{font-family:'Space Grotesk',sans-serif;font-size:1.5rem;margin-bottom:22px}
  .nv-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:18px}
  .nv-card{cursor:pointer;background:var(--nv-card);border:1px solid var(--nv-line);border-radius:12px;overflow:hidden}
  .nv-cardimg{aspect-ratio:1;background:var(--nv-bg2);overflow:hidden}
  .nv-cardimg img{width:100%;height:100%;object-fit:cover;transition:transform .4s}
  .nv-card:hover .nv-cardimg img{transform:scale(1.05)}
  .nv-cardbody{padding:13px}
  .nv-cardname{font-size:13px;font-weight:600;margin-bottom:4px}
  .nv-cardprice{font-weight:700;font-size:13px;color:var(--nv-accent)}

  footer.nv-foot{background:var(--nv-bg2);border-top:1px solid var(--nv-line);padding:26px 32px;text-align:center;font-size:12px;color:var(--nv-mute)}
</style>
</head>
<body>
<nav class="nv-nav">
  <a href="./index5.html" class="nv-logo" id="navLogoWrap" data-store-name>NOVA<span>.</span></a>
  <a href="./cart5.html" class="nv-ibtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><path d="M16 10a4 4 0 0 1-8 0"/></svg><span data-cart-count style="display:none">0</span></a>
</nav>

<div class="nv-crumbs"><a href="./index5.html">Home</a> / <a href="./index5.html#shop">Shop</a> / <span id="crumbName">Product</span></div>

<div class="nv-pwrap">
  <div>
    <div class="nv-mainimg"><img id="mainImg" src="" alt=""></div>
    <div class="nv-thumbs" id="thumbs"></div>
  </div>
  <div class="nv-info">
    <div class="nv-tag" id="pCat">Tech</div>
    <h1 id="pName">Loading…</h1>
    <div class="nv-stars"><span class="row" id="pStarsRow"></span><span id="pReviews"></span></div>
    <div class="nv-priceline">
      <span class="nv-price" id="pPrice"></span>
      <span class="nv-old" id="pOld" style="display:none"></span>
      <span class="nv-pill" id="pStock"></span>
    </div>
    <p class="nv-desc" id="pDesc"></p>
    <div class="nv-qty"><button onclick="changeQty(-1)">−</button><span id="qtyVal">1</span><button onclick="changeQty(1)">+</button></div>
    <div class="nv-actions">
      <button class="nv-addbig" id="addBtn" onclick="addToCart()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:16px;height:16px"><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><path d="M16 10a4 4 0 0 1-8 0"/></svg>
        Add to Cart
      </button>
      <button class="nv-wish" title="Save"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1-1.1a5.5 5.5 0 0 0-7.8 7.8l1 1L12 21l7.8-7.6 1-1a5.5 5.5 0 0 0 0-7.8z"/></svg></button>
    </div>
    <div class="nv-specs">
      <span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 4h11v11H3z"/><path d="M14 9h4l3 3v3h-7z"/><circle cx="7" cy="18" r="2"/><circle cx="18" cy="18" r="2"/></svg> Free shipping over $50</span>
      <span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 12a9 9 0 0 1 15.3-6.4L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-15.3 6.4L3 16"/><path d="M3 21v-5h5"/></svg> 30-day returns</span>
      <span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="4" y="11" width="16" height="9" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg> Secure checkout</span>
      <span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg> 24/7 support</span>
    </div>
  </div>
</div>

<div class="nv-related"><h2>You May Also Like</h2><div class="nv-grid" id="relGrid"></div></div>

<footer class="nv-foot">&copy; <span id="yr"></span> <span data-store-name>Nova</span>. All rights reserved.</footer>

<script src="./js/app.js"></script>
<script>
  const qs = new URLSearchParams(location.search);
  const productId = parseInt(qs.get('id'));
  let currentProduct = null, qty = 1, imgs = [];

  function changeQty(d){ qty = Math.max(1, qty+d); document.getElementById('qtyVal').textContent = qty; }
  function addToCart(){ if (currentProduct) SK.addToCart(currentProduct, qty); }
  function setMainImg(i){
    document.getElementById('mainImg').src = imgs[i];
    document.querySelectorAll('.nv-thumb').forEach((t,idx)=>t.classList.toggle('active', idx===i));
  }
  function renderProduct(){
    const p = currentProduct;
    imgs = SK.getProductImages(p);
    document.getElementById('crumbName').textContent = p.name;
    document.getElementById('pCat').textContent = p.category || 'Tech';
    document.getElementById('pName').textContent = p.name;
    document.getElementById('pStarsRow').innerHTML = SK.renderStars(p.rating||4.5,13);
    document.getElementById('pReviews').textContent = `(${p.reviews||0} reviews)`;
    document.getElementById('pPrice').textContent = SK.price(p.price);
    const onSale = p.oldPrice && p.oldPrice > p.price;
    const oldEl = document.getElementById('pOld');
    oldEl.style.display = onSale ? '' : 'none';
    if (onSale) oldEl.textContent = SK.price(p.oldPrice);
    const stock = SK.stockLabel(p.stock);
    const stockEl = document.getElementById('pStock');
    stockEl.textContent = stock.label; stockEl.className = 'nv-pill ' + stock.cls;
    document.getElementById('pDesc').textContent = p.description || '';
    document.getElementById('thumbs').innerHTML = imgs.map((src,i)=>`<div class="nv-thumb ${i===0?'active':''}" onclick="setMainImg(${i})"><img src="${src}" alt=""></div>`).join('');
    setMainImg(0);
    if (stock.cls === 'stock-out'){ const b=document.getElementById('addBtn'); b.disabled=true; b.textContent='Out of Stock'; }
  }
  function renderRelated(){
    const others = SK.products.filter(p=>p.id!==currentProduct.id && p.category===currentProduct.category).slice(0,4);
    const list = others.length ? others : SK.products.filter(p=>p.id!==currentProduct.id).slice(0,4);
    document.getElementById('relGrid').innerHTML = list.map(p=>`
      <div class="nv-card" onclick="location.href='./product5.html?id=${p.id}'">
        <div class="nv-cardimg"><img src="${SK.getProductImages(p)[0]}" alt="${p.name}"></div>
        <div class="nv-cardbody"><div class="nv-cardname">${p.name}</div><div class="nv-cardprice">${SK.price(p.price)}</div></div>
      </div>`).join('');
  }
  async function main(){
    await SK.init();
    document.getElementById('yr').textContent = new Date().getFullYear();
    if (!productId) { window.location.href = './index5.html'; return; }
    await SK.loadProducts();
    currentProduct = SK.products.find(p=>p.id===productId);
    if (!currentProduct) { window.location.href = './index5.html'; return; }
    SK.addRecentlyViewed(productId);
    renderProduct(); renderRelated();
    document.title = `${currentProduct.name} — Nova`;
    SK.reveal();
  }
  main();
</script>
</body>
</html>
