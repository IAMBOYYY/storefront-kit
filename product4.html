<!DOCTYPE html>
<html lang="en" class="sk-loading">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Product — Pure</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" />
<style id="sk-anti-fouc">html.sk-loading body{opacity:0}body{transition:opacity .25s ease}</style>
<script>setTimeout(function(){document.documentElement.classList.remove("sk-loading");},1800);</script>
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  :root{--pu-ink:#26321f;--pu-green:#4a5e3a;--pu-greendark:#36462a;--pu-cream:#f7f5ee;--pu-card:#eef0e4;--pu-mute:#6c7261;--pu-line:#e0e2d4;--pu-success:#16803d;--pu-danger:#b91c1c}
  body{font-family:'Inter',sans-serif;color:var(--pu-ink);background:var(--pu-cream)}
  h1{font-family:'Cormorant Garamond',serif;font-weight:600}
  a{color:inherit;text-decoration:none} img{display:block;max-width:100%}
  .pu-nav{position:sticky;top:0;z-index:300;background:var(--pu-cream);border-bottom:1px solid var(--pu-line);height:76px;display:flex;align-items:center;justify-content:space-between;padding:0 36px}
  .pu-logo{font-family:'Cormorant Garamond',serif;font-size:1.6rem;font-weight:700;letter-spacing:1px}
  .pu-ibtn{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:none;border:none;cursor:pointer;position:relative}
  .pu-ibtn svg{width:18px;height:18px}
  [data-cart-count]{position:absolute;top:-2px;right:-2px;background:var(--pu-green);color:#fff;font-size:9px;font-weight:700;width:16px;height:16px;border-radius:50%;display:flex;align-items:center;justify-content:center}

  .pu-crumbs{max-width:1280px;margin:0 auto;padding:18px 36px 0;font-size:13px;color:var(--pu-mute)}
  .pu-crumbs a{text-decoration:underline}
  .pu-pwrap{max-width:1280px;margin:0 auto;padding:24px 36px 70px;display:grid;grid-template-columns:1fr 1fr;gap:56px}
  @media(max-width:880px){.pu-pwrap{grid-template-columns:1fr;gap:24px}}

  .pu-mainimg{aspect-ratio:1;background:var(--pu-card);overflow:hidden;border-radius:16px;margin-bottom:10px}
  .pu-mainimg img{width:100%;height:100%;object-fit:cover}
  .pu-thumbs{display:flex;gap:8px}
  .pu-thumb{width:66px;height:66px;border-radius:10px;background:var(--pu-card);cursor:pointer;border:2px solid transparent;overflow:hidden}
  .pu-thumb.active{border-color:var(--pu-green)}
  .pu-thumb img{width:100%;height:100%;object-fit:cover}

  .pu-info .pu-tag{font-size:11px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--pu-green);margin-bottom:10px}
  .pu-info h1{font-size:clamp(1.8rem,3.5vw,2.4rem);margin-bottom:10px}
  .pu-stars{display:flex;align-items:center;gap:8px;margin-bottom:16px;font-size:13px;color:var(--pu-mute)}
  .pu-stars .row{display:flex;gap:1px}
  .pu-stars .row span{width:13px;height:13px;display:inline-flex}
  .pu-priceline{display:flex;align-items:center;gap:10px;margin-bottom:20px}
  .pu-price{font-size:1.5rem;font-weight:700}
  .pu-old{color:var(--pu-mute);text-decoration:line-through;font-size:1rem}
  .pu-pill{font-size:11px;font-weight:700;padding:4px 10px;border-radius:30px}
  .stock-in{background:#e9f9ee;color:var(--pu-success)} .stock-limited{background:#fff4e0;color:#b45309} .stock-out{background:#fdecec;color:var(--pu-danger)}
  .pu-desc{font-size:14px;color:#444;line-height:1.7;margin-bottom:24px}

  .pu-qty{display:flex;align-items:center;border:1px solid var(--pu-line);border-radius:30px;width:fit-content;margin-bottom:16px;background:#fff}
  .pu-qty button{width:38px;height:38px;background:none;border:none;font-size:16px;cursor:pointer;font-weight:700}
  .pu-qty span{width:34px;text-align:center;font-weight:700}
  .pu-actions{display:flex;gap:10px;margin-bottom:26px}
  .pu-addbig{flex:1;background:var(--pu-greendark);color:#fff;border:none;padding:16px;border-radius:30px;font-weight:700;font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px}
  .pu-addbig:disabled{opacity:.35;cursor:not-allowed}
  .pu-wish{width:52px;border:1px solid var(--pu-line);border-radius:30px;background:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center}
  .pu-wish svg{width:18px;height:18px}

  .pu-tabs{display:flex;gap:22px;border-bottom:1px solid var(--pu-line);margin-bottom:16px;font-size:13px;font-weight:600;color:var(--pu-mute)}
  .pu-tabs span{padding-bottom:10px;border-bottom:2px solid transparent}
  .pu-tabs span.active{color:var(--pu-ink);border-color:var(--pu-green)}

  .pu-related{max-width:1280px;margin:0 auto;padding:0 36px 80px}
  .pu-related h2{font-size:1.6rem;margin-bottom:22px}
  .pu-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:22px}
  .pu-card{cursor:pointer;background:#fff;border-radius:12px;overflow:hidden;border:1px solid var(--pu-line)}
  .pu-cardimg{aspect-ratio:1;background:var(--pu-card);overflow:hidden}
  .pu-cardimg img{width:100%;height:100%;object-fit:cover;transition:transform .4s}
  .pu-card:hover .pu-cardimg img{transform:scale(1.05)}
  .pu-cardbody{padding:13px}
  .pu-cardname{font-size:13px;font-weight:600;margin-bottom:4px}
  .pu-cardprice{font-weight:700;font-size:13px}

  footer.pu-foot{background:var(--pu-greendark);color:#cfd6c5;padding:26px 36px;text-align:center;font-size:12px}
</style>
</head>
<body>
<nav class="pu-nav">
  <a href="./index4.html" class="pu-logo" id="navLogoWrap" data-store-name>PURE</a>
  <a href="./cart4.html" class="pu-ibtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><path d="M16 10a4 4 0 0 1-8 0"/></svg><span data-cart-count style="display:none">0</span></a>
</nav>

<div class="pu-crumbs"><a href="./index4.html">Home</a> / <a href="./index4.html#shop">Shop</a> / <span id="crumbName">Product</span></div>

<div class="pu-pwrap">
  <div>
    <div class="pu-mainimg"><img id="mainImg" src="" alt=""></div>
    <div class="pu-thumbs" id="thumbs"></div>
  </div>
  <div class="pu-info">
    <div class="pu-tag" id="pCat">Skincare</div>
    <h1 id="pName">Loading…</h1>
    <div class="pu-stars"><span class="row" id="pStarsRow"></span><span id="pReviews"></span></div>
    <div class="pu-priceline">
      <span class="pu-price" id="pPrice"></span>
      <span class="pu-old" id="pOld" style="display:none"></span>
      <span class="pu-pill" id="pStock"></span>
    </div>
    <p class="pu-desc" id="pDesc"></p>

    <div class="pu-tabs"><span class="active">How to Use</span><span>Ingredients</span><span>Reviews</span></div>

    <div class="pu-qty">
      <button onclick="changeQty(-1)">−</button><span id="qtyVal">1</span><button onclick="changeQty(1)">+</button>
    </div>
    <div class="pu-actions">
      <button class="pu-addbig" id="addBtn" onclick="addToCart()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:16px;height:16px"><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><path d="M16 10a4 4 0 0 1-8 0"/></svg>
        Add to Cart
      </button>
      <button class="pu-wish" title="Save"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1-1.1a5.5 5.5 0 0 0-7.8 7.8l1 1L12 21l7.8-7.6 1-1a5.5 5.5 0 0 0 0-7.8z"/></svg></button>
    </div>
  </div>
</div>

<div class="pu-related"><h2>You Might Also Like</h2><div class="pu-grid" id="relGrid"></div></div>

<footer class="pu-foot">&copy; <span id="yr"></span> <span data-store-name>Pure</span>. All rights reserved.</footer>

<script src="./js/app.js"></script>
<script>
  const qs = new URLSearchParams(location.search);
  const productId = parseInt(qs.get('id'));
  let currentProduct = null, qty = 1, imgs = [];

  function changeQty(d){ qty = Math.max(1, qty+d); document.getElementById('qtyVal').textContent = qty; }
  function addToCart(){ if (currentProduct) SK.addToCart(currentProduct, qty); }
  function setMainImg(i){
    document.getElementById('mainImg').src = imgs[i];
    document.querySelectorAll('.pu-thumb').forEach((t,idx)=>t.classList.toggle('active', idx===i));
  }

  function renderProduct(){
    const p = currentProduct;
    imgs = SK.getProductImages(p);
    document.getElementById('crumbName').textContent = p.name;
    document.getElementById('pCat').textContent = p.category || 'Skincare';
    document.getElementById('pName').textContent = p.name;
    document.getElementById('pStarsRow').innerHTML = SK.renderStars(p.rating||4.6,13);
    document.getElementById('pReviews').textContent = `(${p.reviews||0} reviews)`;
    document.getElementById('pPrice').textContent = SK.price(p.price);
    const onSale = p.oldPrice && p.oldPrice > p.price;
    const oldEl = document.getElementById('pOld');
    oldEl.style.display = onSale ? '' : 'none';
    if (onSale) oldEl.textContent = SK.price(p.oldPrice);
    const stock = SK.stockLabel(p.stock);
    const stockEl = document.getElementById('pStock');
    stockEl.textContent = stock.label; stockEl.className = 'pu-pill ' + stock.cls;
    document.getElementById('pDesc').textContent = p.description || '';
    document.getElementById('thumbs').innerHTML = imgs.map((src,i)=>`<div class="pu-thumb ${i===0?'active':''}" onclick="setMainImg(${i})"><img src="${src}" alt=""></div>`).join('');
    setMainImg(0);
    if (stock.cls === 'stock-out'){ const b=document.getElementById('addBtn'); b.disabled=true; b.textContent='Out of Stock'; }
  }

  function renderRelated(){
    const others = SK.products.filter(p=>p.id!==currentProduct.id && p.category===currentProduct.category).slice(0,4);
    const list = others.length ? others : SK.products.filter(p=>p.id!==currentProduct.id).slice(0,4);
    document.getElementById('relGrid').innerHTML = list.map(p=>`
      <div class="pu-card" onclick="location.href='./product4.html?id=${p.id}'">
        <div class="pu-cardimg"><img src="${SK.getProductImages(p)[0]}" alt="${p.name}"></div>
        <div class="pu-cardbody"><div class="pu-cardname">${p.name}</div><div class="pu-cardprice">${SK.price(p.price)}</div></div>
      </div>`).join('');
  }

  async function main(){
    await SK.init();
    document.getElementById('yr').textContent = new Date().getFullYear();
    if (!productId) { window.location.href = './index4.html'; return; }
    await SK.loadProducts();
    currentProduct = SK.products.find(p=>p.id===productId);
    if (!currentProduct) { window.location.href = './index4.html'; return; }
    SK.addRecentlyViewed(productId);
    renderProduct(); renderRelated();
    document.title = `${currentProduct.name} — Pure`;
    SK.reveal();
  }
  main();
</script>
</body>
</html>
