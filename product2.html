<!DOCTYPE html>
<html lang="en" class="sk-loading">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Product — Velocity</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter:wght@400;500;600;700;800&display=swap" />
<style id="sk-anti-fouc">html.sk-loading body{opacity:0}body{transition:opacity .25s ease}</style>
<script>setTimeout(function(){document.documentElement.classList.remove("sk-loading");},1800);</script>
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  :root{--vlx-ink:#0c0c0c;--vlx-paper:#fff;--vlx-mute:#6b6b6b;--vlx-line:#e7e7e7;--vlx-card:#f5f5f5;--vlx-accent:#ff3b30}
  body{font-family:'Inter',sans-serif;color:var(--vlx-ink);background:var(--vlx-paper)}
  h1,h2,h3{font-family:'Archivo Black',sans-serif;text-transform:uppercase;letter-spacing:-.5px;line-height:1.05}
  a{color:inherit;text-decoration:none} img{display:block;max-width:100%}
  .vlx-utility{background:var(--vlx-ink);color:#fff;text-align:center;font-size:11px;font-weight:600;letter-spacing:1.5px;padding:9px 12px;text-transform:uppercase}
  .vlx-nav{position:sticky;top:0;z-index:300;background:var(--vlx-paper);border-bottom:2px solid var(--vlx-ink);height:72px;display:flex;align-items:center;justify-content:space-between;padding:0 28px}
  .vlx-logo{font-family:'Archivo Black',sans-serif;font-size:1.5rem;letter-spacing:-1px}
  .vlx-iconbtn{width:38px;height:38px;border-radius:50%;border:1.5px solid var(--vlx-ink);display:flex;align-items:center;justify-content:center;position:relative;background:none}
  .vlx-iconbtn svg{width:16px;height:16px}
  [data-cart-count]{position:absolute;top:-6px;right:-6px;background:var(--vlx-accent);color:#fff;font-size:10px;font-weight:800;width:18px;height:18px;border-radius:50%;display:flex;align-items:center;justify-content:center}

  .vlx-crumbs{max-width:1320px;margin:0 auto;padding:20px 28px 0;font-size:12px;color:var(--vlx-mute);font-weight:600}
  .vlx-crumbs a{text-decoration:underline}
  .vlx-pwrap{max-width:1320px;margin:0 auto;padding:24px 28px 70px;display:grid;grid-template-columns:1.1fr 1fr;gap:54px}
  @media(max-width:880px){.vlx-pwrap{grid-template-columns:1fr;gap:24px}}

  .vlx-gallery{display:flex;flex-direction:column;gap:10px}
  .vlx-mainimg{aspect-ratio:1;background:var(--vlx-card);overflow:hidden;position:relative}
  .vlx-mainimg img{width:100%;height:100%;object-fit:cover}
  .vlx-thumbs{display:flex;gap:8px;overflow-x:auto}
  .vlx-thumb{width:74px;height:74px;flex-shrink:0;background:var(--vlx-card);cursor:pointer;border:2px solid transparent;overflow:hidden}
  .vlx-thumb.active{border-color:var(--vlx-ink)}
  .vlx-thumb img{width:100%;height:100%;object-fit:cover}

  .vlx-info .vlx-cat{font-size:11px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--vlx-accent);margin-bottom:10px}
  .vlx-info h1{font-size:clamp(1.6rem,3vw,2.3rem);margin-bottom:14px}
  .vlx-stars{display:flex;align-items:center;gap:8px;margin-bottom:16px;font-size:13px;color:var(--vlx-mute);font-weight:600}
  .vlx-stars .row{display:flex;gap:2px}
  .vlx-stars .row span{width:14px;height:14px;display:inline-flex}
  .vlx-priceline{display:flex;align-items:center;gap:12px;margin-bottom:20px}
  .vlx-price{font-size:1.7rem;font-weight:800}
  .vlx-old{font-size:1rem;color:var(--vlx-mute);text-decoration:line-through}
  .vlx-stock{font-size:12px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;padding:4px 10px;border-radius:30px}
  .stock-in{background:#e9f9ee;color:#16803d} .stock-limited{background:#fff4e0;color:#b45309} .stock-out{background:#fdecec;color:#b91c1c}
  .vlx-desc{font-size:14px;color:#333;line-height:1.7;margin-bottom:26px;text-transform:none;font-weight:400}

  .vlx-qty{display:flex;align-items:center;border:1.5px solid var(--vlx-ink);width:fit-content;margin-bottom:16px}
  .vlx-qty button{width:42px;height:42px;background:none;border:none;font-size:18px;cursor:pointer;font-weight:700}
  .vlx-qty span{width:42px;text-align:center;font-weight:700}
  .vlx-actions{display:flex;gap:12px;margin-bottom:28px;flex-wrap:wrap}
  .vlx-addbig{flex:1;min-width:200px;background:var(--vlx-ink);color:#fff;border:none;padding:17px 20px;font-family:'Archivo Black',sans-serif;font-size:13px;letter-spacing:1.5px;text-transform:uppercase;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:10px;transition:opacity .2s}
  .vlx-addbig:hover{opacity:.85}
  .vlx-addbig:disabled{opacity:.35;cursor:not-allowed}
  .vlx-wishbtn{width:54px;height:54px;border:1.5px solid var(--vlx-ink);background:none;cursor:pointer;display:flex;align-items:center;justify-content:center}
  .vlx-wishbtn svg{width:18px;height:18px}

  .vlx-trustrow{display:flex;gap:22px;flex-wrap:wrap;border-top:1px solid var(--vlx-line);padding-top:20px;font-size:12px;color:var(--vlx-mute);font-weight:600}
  .vlx-trustrow span{display:flex;align-items:center;gap:7px}
  .vlx-trustrow svg{width:16px;height:16px}

  .vlx-related{max-width:1320px;margin:0 auto;padding:0 28px 80px}
  .vlx-related h2{font-size:1.6rem;margin-bottom:24px}
  .vlx-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:2px;background:var(--vlx-line)}
  .vlx-card{background:#fff;cursor:pointer}
  .vlx-cardimg{aspect-ratio:1;background:var(--vlx-card);overflow:hidden}
  .vlx-cardimg img{width:100%;height:100%;object-fit:cover;transition:transform .4s}
  .vlx-card:hover .vlx-cardimg img{transform:scale(1.07)}
  .vlx-cardbody{padding:14px}
  .vlx-cardname{font-weight:700;font-size:13px;margin-bottom:6px}
  .vlx-cardprice{font-weight:800;font-size:14px}

  footer.vlx-foot{background:var(--vlx-ink);color:#aaa;padding:30px 28px;text-align:center;font-size:12px}
</style>
</head>
<body>
<div class="vlx-utility">Free shipping on orders over $75 — New drops every Friday</div>
<nav class="vlx-nav">
  <a href="./index2.html" class="vlx-logo" id="navLogoWrap" data-store-name>VELOCITY</a>
  <a href="./cart2.html" class="vlx-iconbtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><path d="M16 10a4 4 0 0 1-8 0"/></svg><span data-cart-count style="display:none">0</span></a>
</nav>

<div class="vlx-crumbs"><a href="./index2.html">Home</a> / <a href="./index2.html#shop">Shop</a> / <span id="crumbName">Product</span></div>

<div class="vlx-pwrap">
  <div class="vlx-gallery">
    <div class="vlx-mainimg"><img id="mainImg" src="" alt=""></div>
    <div class="vlx-thumbs" id="thumbs"></div>
  </div>
  <div class="vlx-info">
    <div class="vlx-cat" id="pCat">Shop</div>
    <h1 id="pName">Loading…</h1>
    <div class="vlx-stars" id="pStars"></div>
    <div class="vlx-priceline">
      <span class="vlx-price" id="pPrice"></span>
      <span class="vlx-old" id="pOld" style="display:none"></span>
      <span class="vlx-stock" id="pStock"></span>
    </div>
    <p class="vlx-desc" id="pDesc"></p>
    <div class="vlx-qty">
      <button onclick="changeQty(-1)">−</button>
      <span id="qtyVal">1</span>
      <button onclick="changeQty(1)">+</button>
    </div>
    <div class="vlx-actions">
      <button class="vlx-addbig" id="addBtn" onclick="addToCart()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:16px;height:16px"><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><path d="M16 10a4 4 0 0 1-8 0"/></svg>
        Add to Cart
      </button>
      <button class="vlx-wishbtn" title="Save"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1-1.1a5.5 5.5 0 0 0-7.8 7.8l1 1L12 21l7.8-7.6 1-1a5.5 5.5 0 0 0 0-7.8z"/></svg></button>
    </div>
    <div class="vlx-trustrow">
      <span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 4h11v11H3z"/><path d="M14 9h4l3 3v3h-7z"/><circle cx="7" cy="18" r="2"/><circle cx="18" cy="18" r="2"/></svg> Free shipping over $75</span>
      <span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12a9 9 0 0 1 15.3-6.4L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-15.3 6.4L3 16"/><path d="M3 21v-5h5"/></svg> 30-day returns</span>
      <span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="11" width="16" height="9" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg> Secure checkout</span>
    </div>
  </div>
</div>

<div class="vlx-related">
  <h2>You May Also Like</h2>
  <div class="vlx-grid" id="relGrid"></div>
</div>

<footer class="vlx-foot">&copy; <span id="yr"></span> <span data-store-name>Velocity</span>. All rights reserved.</footer>

<script src="./js/app.js"></script>
<script>
  const qs = new URLSearchParams(location.search);
  const productId = parseInt(qs.get('id'));
  let currentProduct = null, qty = 1, imgs = [];

  function changeQty(d){ qty = Math.max(1, qty + d); document.getElementById('qtyVal').textContent = qty; }

  function addToCart(){
    if (!currentProduct) return;
    SK.addToCart(currentProduct, qty);
  }

  function setMainImg(i){
    document.getElementById('mainImg').src = imgs[i];
    document.querySelectorAll('.vlx-thumb').forEach((t,idx)=>t.classList.toggle('active', idx===i));
  }

  function renderProduct(){
    const p = currentProduct;
    imgs = SK.getProductImages(p);
    document.getElementById('crumbName').textContent = p.name;
    document.getElementById('pCat').textContent = p.category || 'Shop';
    document.getElementById('pName').textContent = p.name;
    document.getElementById('pStars').innerHTML = SK.renderStars(p.rating || 4.5) + `<span>(${p.reviews || 0} reviews)</span>`;
    document.getElementById('pPrice').textContent = SK.price(p.price);
    const onSale = p.oldPrice && p.oldPrice > p.price;
    const oldEl = document.getElementById('pOld');
    oldEl.style.display = onSale ? '' : 'none';
    if (onSale) oldEl.textContent = SK.price(p.oldPrice);
    const stock = SK.stockLabel(p.stock);
    const stockEl = document.getElementById('pStock');
    stockEl.textContent = stock.label; stockEl.className = 'vlx-stock ' + stock.cls;
    document.getElementById('pDesc').textContent = p.description || '';
    document.getElementById('thumbs').innerHTML = imgs.map((src,i) =>
      `<div class="vlx-thumb ${i===0?'active':''}" onclick="setMainImg(${i})"><img src="${src}" alt=""></div>`).join('');
    setMainImg(0);
    const addBtn = document.getElementById('addBtn');
    if (stock.cls === 'stock-out') { addBtn.disabled = true; addBtn.textContent = 'Out of Stock'; }
  }

  function renderRelated(){
    const others = SK.products.filter(p => p.id !== currentProduct.id && p.category === currentProduct.category).slice(0,4);
    const list = others.length ? others : SK.products.filter(p => p.id !== currentProduct.id).slice(0,4);
    document.getElementById('relGrid').innerHTML = list.map(p => `
      <div class="vlx-card" onclick="location.href='./product2.html?id=${p.id}'">
        <div class="vlx-cardimg"><img src="${SK.getProductImages(p)[0]}" alt="${p.name}"></div>
        <div class="vlx-cardbody">
          <div class="vlx-cardname">${p.name}</div>
          <div class="vlx-cardprice">${SK.price(p.price)}</div>
        </div>
      </div>`).join('');
  }

  async function main(){
    await SK.init();
    document.getElementById('yr').textContent = new Date().getFullYear();
    if (!productId) { window.location.href = './index2.html'; return; }
    await SK.loadProducts();
    currentProduct = SK.products.find(p => p.id === productId);
    if (!currentProduct) { window.location.href = './index2.html'; return; }
    SK.addRecentlyViewed(productId);
    renderProduct();
    renderRelated();
    document.title = `${currentProduct.name} — Velocity`;
    SK.reveal();
  }
  main();
</script>
</body>
</html>
