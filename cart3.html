<!DOCTYPE html>
<html lang="en" class="sk-loading">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Cart — Essentials</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" />
<style id="sk-anti-fouc">html.sk-loading body{opacity:0}body{transition:opacity .25s ease}</style>
<script>setTimeout(function(){document.documentElement.classList.remove("sk-loading");},1800);</script>
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  :root{--es-ink:#111;--es-mute:#777;--es-line:#eaeaea;--es-card:#f7f7f7;--es-paper:#fff}
  body{font-family:'Inter',sans-serif;color:var(--es-ink);background:var(--es-paper)}
  a{color:inherit;text-decoration:none} img{display:block;max-width:100%}
  .es-bar{background:var(--es-ink);color:#fff;text-align:center;font-size:12px;padding:9px;font-weight:500}
  .es-nav{position:sticky;top:0;z-index:300;background:var(--es-paper);border-bottom:1px solid var(--es-line);height:74px;display:flex;align-items:center;justify-content:space-between;padding:0 32px}
  .es-logo{font-size:1.4rem;font-weight:800;letter-spacing:-.5px}
  .es-backlink{font-size:13px;font-weight:600;display:flex;align-items:center;gap:6px;color:#444}
  .es-backlink svg{width:14px;height:14px}

  .es-wrap{max-width:980px;margin:0 auto;padding:46px 32px 90px}
  .es-wrap h1{font-size:clamp(1.6rem,4vw,2.2rem);font-weight:800;letter-spacing:-.5px;margin-bottom:28px}
  .es-layout{display:grid;grid-template-columns:1.6fr 1fr;gap:40px}
  @media(max-width:780px){.es-layout{grid-template-columns:1fr}}

  .es-line{display:grid;grid-template-columns:84px 1fr auto auto;gap:16px;align-items:center;padding:18px 0;border-bottom:1px solid var(--es-line)}
  .es-line img{width:84px;height:84px;object-fit:cover;background:var(--es-card);border-radius:6px}
  .es-lname{font-weight:700;font-size:14px;margin-bottom:6px}
  .es-lprice{font-size:13px;color:var(--es-mute)}
  .es-lqty{display:flex;align-items:center;border:1px solid var(--es-line);border-radius:30px}
  .es-lqty button{width:28px;height:28px;background:none;border:none;font-size:14px;cursor:pointer;font-weight:700}
  .es-lqty span{width:26px;text-align:center;font-weight:600;font-size:13px}
  .es-ltotal{font-weight:700;font-size:14px;text-align:right;min-width:64px}
  .es-remove{background:none;border:none;cursor:pointer;color:var(--es-mute);width:15px;height:15px;justify-self:end}

  .es-empty{text-align:center;padding:80px 20px;color:var(--es-mute)}
  .es-empty svg{width:50px;height:50px;margin-bottom:18px;color:var(--es-line)}
  .es-empty a{display:inline-block;margin-top:18px;background:var(--es-ink);color:#fff;padding:14px 28px;border-radius:4px;font-weight:700;font-size:13px}

  .es-summary{border:1px solid var(--es-line);border-radius:8px;padding:24px;height:fit-content;background:var(--es-card)}
  .es-summary h2{font-size:1.05rem;font-weight:800;margin-bottom:18px}
  .es-srow{display:flex;justify-content:space-between;font-size:14px;margin-bottom:12px;color:var(--es-mute)}
  .es-srow.total{color:var(--es-ink);font-size:1.15rem;font-weight:800;border-top:1px solid var(--es-line);padding-top:14px;margin-top:8px}
  .es-checkoutbtn{width:100%;background:var(--es-ink);color:#fff;border:none;padding:15px;border-radius:4px;font-weight:700;font-size:14px;cursor:pointer;margin-top:16px}
  .es-note{font-size:12px;color:var(--es-mute);margin-top:14px;text-align:center}

  footer.es-foot{border-top:1px solid var(--es-line);padding:26px 32px;text-align:center;font-size:12px;color:var(--es-mute)}
</style>
</head>
<body>
<div class="es-bar">Free shipping on orders over $99 &middot; Easy 30-day returns</div>
<nav class="es-nav">
  <a href="./index3.html" class="es-logo" id="navLogoWrap" data-store-name>ESSENTIALS</a>
  <a href="./index3.html" class="es-backlink"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14"/><path d="m11 18-6-6 6-6"/></svg> Continue Shopping</a>
</nav>

<div class="es-wrap"><h1>Your Cart</h1><div id="cartLayout"></div></div>

<footer class="es-foot">&copy; <span id="yr"></span> <span data-store-name>Essentials</span>. All rights reserved.</footer>

<script src="./js/app.js"></script>
<script>
  function lineHTML(item){
    return `<div class="es-line">
      <img src="${item.image}" alt="${item.name}">
      <div><div class="es-lname">${item.name}</div><div class="es-lprice">${SK.price(item.price)} each</div></div>
      <div class="es-lqty">
        <button onclick="SK.changeQty(${item.id},-1);render()">−</button><span>${item.qty}</span><button onclick="SK.changeQty(${item.id},1);render()">+</button>
      </div>
      <div style="display:flex;flex-direction:column;align-items:flex-end;gap:8px">
        <div class="es-ltotal">${SK.price(item.price*item.qty)}</div>
        <button class="es-remove" onclick="SK.removeFromCart(${item.id});render()" title="Remove"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
      </div>
    </div>`;
  }
  function render(){
    const cart = SK.getCart();
    const wrap = document.getElementById('cartLayout');
    if (!cart.length){
      wrap.innerHTML = `<div class="es-empty"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><path d="M16 10a4 4 0 0 1-8 0"/></svg><div>Your cart is empty.</div><a href="./index3.html">Start Shopping</a></div>`;
      return;
    }
    const total = SK.cartTotal();
    wrap.innerHTML = `<div class="es-layout">
      <div>${cart.map(lineHTML).join('')}</div>
      <div class="es-summary">
        <h2>Order Summary</h2>
        <div class="es-srow"><span>Subtotal</span><span>${SK.price(total)}</span></div>
        <div class="es-srow"><span>Shipping</span><span>${total>=99?'Free':'Calculated at checkout'}</span></div>
        <div class="es-srow total"><span>Total</span><span>${SK.price(total)}</span></div>
        <button class="es-checkoutbtn" onclick="location.href='./checkout3.html'">Proceed to Checkout</button>
        <div class="es-note">Taxes calculated at checkout. Cash on Delivery available.</div>
      </div>
    </div>`;
  }
  async function main(){
    await SK.init();
    document.getElementById('yr').textContent = new Date().getFullYear();
    render();
    SK.reveal();
  }
  main();
</script>
</body>
</html>
